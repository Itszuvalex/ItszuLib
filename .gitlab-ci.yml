image: java:8-jdk

cache:
  untracked: true
  key: "default"
  paths:
    - .gradle/
    - src/
    - build/
    - /builds/
    - .gradlecache/

stages:
  - build

full_build:
  stage: build
  only:
    - master
    - develop
  script:
    - rm -rf build/libs/*
    - chmod +x ./gradlew
    - ./gradlew setupCIWorkspace
    - ./gradlew build -x test
    - ./gradlew artifactoryPublish --info
