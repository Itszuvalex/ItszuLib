image: oracle-java8:latest

stages:
  - build

full_build:
  stage: build
  only:
    - master
    - develop
  script:
    - rm -rf build/libs/*
    - chmod +x ./gradlew
    - ./gradlew setupCIWorkspace
    - ./gradlew build -x test
    - ./gradlew artifactoryPublish
  cache:
    untracked: true
    key: "$CI_BUILD_NAME"