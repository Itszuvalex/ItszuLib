image: java:8-jdk

stages:
  - setup
  - build
  - test
  - publish

setup_forge:
  stage: setup
  only:
   - master
   - develop
  script:
    - rm -rf build/libs/*
    - chmod +x ./gradlew
    - ./gradlew setupCIWorkspace
  cache:
    untracked: true
    key: "cache_main_pipe"

build_mod:
  stage: build
  only:
    - master
    - develop
  script:
    - ./gradlew build -x test
  cache:
    untracked: true
    key: "cache_main_pipe"

test_mod:
  stage: test
  only:
    - master
    - develop
  script:
    - ./gradlew test
  cache:
    untracked: true
    key: "cache_main_pipe"

publish_mod:
  stage: publish
  only:
    - master
    - develop
  script:
    - ./gradlew artifactoryPublish
  cache:
    untracked: true
    key: "cache_main_pipe"