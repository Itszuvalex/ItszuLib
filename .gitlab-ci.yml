image: ubuntu_gradle_jdk:latest

stages:
  - build

full_build:
  stage: build
  only:
    - master
    - develop
  script:
#    - apt-get update
#    - apt-get install --yes --force-yes gradle
    - rm -rf build/libs/*
    - gradlew setupCIWorkspace
    - gradlew build
    - gradlew artifactoryPublish
  cache:
    untracked: true
    key: "$CI_BUILD_NAME"