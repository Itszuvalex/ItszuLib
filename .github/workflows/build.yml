name: Build

on:
  push:
    branches: [main]
    # A version tag builds a release: same checks, then the jars go on the tag's GitHub release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Public repo on a self-hosted runner: never run pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write # attach jars to releases
    steps:
      - uses: actions/checkout@v4

      # The build compiles with a JDK 25 toolchain; NeoForge's tooling also needs JDK 21.
      - id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and unit tests
        run: ./gradlew build --stacktrace "-Porg.gradle.java.installations.paths=${{ steps.jdk21.outputs.path }},${{ steps.jdk25.outputs.path }}"

      - name: Game tests
        run: ./gradlew runGameTestServer --stacktrace "-Porg.gradle.java.installations.paths=${{ steps.jdk21.outputs.path }},${{ steps.jdk25.outputs.path }}"

      # Everything else is validation only: nothing is uploaded.
      - name: Attach jars to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          fail_on_unmatched_files: true
